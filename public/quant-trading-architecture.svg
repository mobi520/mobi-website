<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBF6F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F2E4DD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C49A8C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4B896;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DECBB8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDE0D4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="65" font-family="Georgia,serif" font-size="28" fill="#3A2F2B" letter-spacing="2" font-weight="bold">四引擎架构</text>
  <text x="60" y="92" font-family="sans-serif" font-size="11" fill="#8B7D78" letter-spacing="1">数据 → 主题 → 龙头 → 组合 → 回测</text>

  <!-- Arrow line connecting engines -->
  <line x1="80" y1="330" x2="720" y2="330" stroke="#C49A8C" stroke-width="1" opacity="0.3"/>
  <polygon points="720,326 730,330 720,334" fill="#C49A8C" opacity="0.4"/>

  <!-- Engine 1: Theme State Engine -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="155" height="360" rx="10" fill="white" opacity="0.55" stroke="#EDE0D4" stroke-width="0.5"/>
    <!-- Engine label -->
    <text x="30" y="30" font-family="Georgia,serif" font-size="13" fill="#3A2F2B" font-weight="bold">主题识别</text>
    <line x1="15" y1="42" x2="140" y2="42" stroke="#EDE0D4" stroke-width="0.5"/>
    <!-- States -->
    <rect x="12" y="55" width="131" height="28" rx="14" fill="#F2E4DD" opacity="0.7"/>
    <text x="25" y="73" font-family="sans-serif" font-size="9" fill="#8B7D78">COLD 冷启动</text>
    <rect x="12" y="90" width="131" height="28" rx="14" fill="#EDE0D4" opacity="0.5"/>
    <text x="25" y="108" font-family="sans-serif" font-size="9" fill="#8B7D78">BREWING 酝酿期</text>
    <rect x="12" y="125" width="131" height="28" rx="14" fill="#D4B896" opacity="0.4"/>
    <text x="25" y="143" font-family="sans-serif" font-size="9" fill="#8B7D78">RALLYING 爆发期</text>
    <rect x="12" y="160" width="131" height="28" rx="14" fill="#C49A8C" opacity="0.3"/>
    <text x="25" y="178" font-family="sans-serif" font-size="9" fill="#8B7D78">CLIMAX 高潮期</text>
    <rect x="12" y="195" width="131" height="28" rx="14" fill="#EDE0D4" opacity="0.5"/>
    <text x="25" y="213" font-family="sans-serif" font-size="9" fill="#8B7D78">FADING 消退期</text>
    <line x1="15" y1="240" x2="140" y2="240" stroke="#EDE0D4" stroke-width="0.5"/>
    <text x="15" y="260" font-family="sans-serif" font-size="9" fill="#8B7D78">7维信号融合</text>
    <text x="15" y="278" font-family="sans-serif" font-size="9" fill="#8B7D78">5态滞回状态机</text>
    <text x="15" y="305" font-family="sans-serif" font-size="9" fill="#C49A8C">→ 主题热度评分</text>
  </g>

  <!-- Engine 2: Leader Engine -->
  <g transform="translate(230, 130)">
    <rect x="0" y="0" width="155" height="360" rx="10" fill="white" opacity="0.55" stroke="#EDE0D4" stroke-width="0.5"/>
    <text x="30" y="30" font-family="Georgia,serif" font-size="13" fill="#3A2F2B" font-weight="bold">龙头筛选</text>
    <line x1="15" y1="42" x2="140" y2="42" stroke="#EDE0D4" stroke-width="0.5"/>
    <text x="15" y="68" font-family="sans-serif" font-size="9" fill="#8B7D78">8维评分体系</text>
    <text x="15" y="90" font-family="sans-serif" font-size="9" fill="#8B7D78">· 龙头确认</text>
    <text x="15" y="108" font-family="sans-serif" font-size="9" fill="#8B7D78">· 中军持仓</text>
    <text x="15" y="126" font-family="sans-serif" font-size="9" fill="#8B7D78">· 先锋信号</text>
    <text x="15" y="144" font-family="sans-serif" font-size="9" fill="#8B7D78">· 跟风过滤</text>
    <line x1="15" y1="165" x2="140" y2="165" stroke="#EDE0D4" stroke-width="0.5"/>
    <rect x="12" y="180" width="131" height="55" rx="6" fill="#C49A8C" opacity="0.08" stroke="#D4B896" stroke-width="0.3"/>
    <text x="15" y="198" font-family="sans-serif" font-size="9" fill="#C49A8C">四角色分类</text>
    <text x="15" y="218" font-family="sans-serif" font-size="8" fill="#8B7D78">龙头 · 中军 · 先锋 · 跟风</text>
  </g>

  <!-- Engine 3: Portfolio Engine -->
  <g transform="translate(400, 130)">
    <rect x="0" y="0" width="155" height="360" rx="10" fill="white" opacity="0.55" stroke="#EDE0D4" stroke-width="0.5"/>
    <text x="30" y="30" font-family="Georgia,serif" font-size="13" fill="#3A2F2B" font-weight="bold">组合构建</text>
    <line x1="15" y1="42" x2="140" y2="42" stroke="#EDE0D4" stroke-width="0.5"/>
    <text x="15" y="68" font-family="sans-serif" font-size="9" fill="#8B7D78">风险预算优化</text>
    <text x="15" y="90" font-family="sans-serif" font-size="9" fill="#8B7D78">仓位动态分配</text>
    <text x="15" y="112" font-family="sans-serif" font-size="9" fill="#8B7D78">止盈止损规则</text>
    <text x="15" y="134" font-family="sans-serif" font-size="9" fill="#8B7D78">大盘MA风控</text>
    <!-- Mini pie chart -->
    <circle cx="77" cy="220" r="50" fill="none" stroke="#EDE0D4" stroke-width="0.5"/>
    <path d="M77,220 L77,170 A50,50 0 0,1 117,195" fill="#C49A8C" opacity="0.25"/>
    <path d="M77,220 L117,195 A50,50 0 0,1 95,262" fill="#D4B896" opacity="0.15"/>
    <path d="M77,220 L95,262 A50,50 0 0,1 55,255" fill="#EDE0D4" opacity="0.2"/>
    <circle cx="77" cy="220" r="15" fill="white" opacity="0.5"/>
  </g>

  <!-- Engine 4: Backtest Engine -->
  <g transform="translate(570, 130)">
    <rect x="0" y="0" width="170" height="360" rx="10" fill="white" opacity="0.55" stroke="#EDE0D4" stroke-width="0.5"/>
    <text x="30" y="30" font-family="Georgia,serif" font-size="13" fill="#3A2F2B" font-weight="bold">回测验证</text>
    <line x1="15" y1="42" x2="155" y2="42" stroke="#EDE0D4" stroke-width="0.5"/>
    <text x="15" y="68" font-family="sans-serif" font-size="9" fill="#8B7D78">事件驱动回测引擎</text>
    <text x="15" y="90" font-family="sans-serif" font-size="9" fill="#8B7D78">Brinson 归因分析</text>
    <text x="15" y="112" font-family="sans-serif" font-size="9" fill="#8B7D78">参数网格测试</text>
    <line x1="15" y1="135" x2="155" y2="135" stroke="#EDE0D4" stroke-width="0.5"/>
    <!-- Mini perf chart -->
    <polyline points="25,180 45,210 65,190 85,205 105,185 125,195 145,170"
      fill="none" stroke="#C49A8C" stroke-width="1.5" opacity="0.6"/>
    <polyline points="25,200 45,195 65,205 85,210 105,200 125,208 145,215"
      fill="none" stroke="#EDE0D4" stroke-width="0.8" opacity="0.5"/>
    <!-- Benchmark labels -->
    <text x="145" y="172" font-family="sans-serif" font-size="7" fill="#C49A8C">策略</text>
    <text x="145" y="212" font-family="sans-serif" font-size="7" fill="#8B7D78">基准</text>
    <line x1="15" y1="240" x2="155" y2="240" stroke="#EDE0D4" stroke-width="0.5"/>
    <!-- Data sources summary -->
    <rect x="12" y="255" width="146" height="85" rx="6" fill="#F2E4DD" opacity="0.4"/>
    <text x="15" y="275" font-family="sans-serif" font-size="9" fill="#8B7D78">7类数据源</text>
    <text x="15" y="293" font-family="sans-serif" font-size="9" fill="#8B7D78">20个Alpha因子</text>
    <text x="15" y="311" font-family="sans-serif" font-size="9" fill="#8B7D78">4个LLM另类因子</text>
    <text x="15" y="329" font-family="sans-serif" font-size="9" fill="#C49A8C">50只股票池</text>
  </g>

  <!-- Data flow arrows between engines -->
  <g fill="#C49A8C" opacity="0.25">
    <polygon points="215,305 228,315 215,325"/>
    <polygon points="385,305 398,315 385,325"/>
    <polygon points="555,305 568,315 555,325"/>
  </g>

  <!-- Bottom data pipeline bar -->
  <rect x="60" y="520" width="680" height="45" rx="22" fill="white" opacity="0.4" stroke="#EDE0D4" stroke-width="0.5"/>
  <text x="80" y="547" font-family="sans-serif" font-size="11" fill="#8B7D78" letter-spacing="1">数据层</text>
  <text x="160" y="547" font-family="sans-serif" font-size="10" fill="#C49A8C">腾讯行情</text>
  <text x="280" y="547" font-family="sans-serif" font-size="10" fill="#C49A8C">东方财富</text>
  <text x="400" y="547" font-family="sans-serif" font-size="10" fill="#C49A8C">同花顺</text>
  <text x="510" y="547" font-family="sans-serif" font-size="10" fill="#C49A8C">巨潮公告</text>
  <text x="620" y="547" font-family="sans-serif" font-size="10" fill="#C49A8C">新闻舆情</text>

</svg>
