<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d30"/>
      <stop offset="100%" style="stop-color:#4a4a50"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="200" cy="180" r="120"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>

  <!-- Decorative glow -->
  <circle cx="200" cy="200" r="160" fill="url(#accent)" opacity="0.08"/>
  <circle cx="140" cy="140" r="100" fill="url(#accent)" opacity="0.06"/>

  <!-- Profile circle -->
  <circle cx="200" cy="180" r="120" fill="#1d1d1f" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Abstract portrait - minimal geometric head -->
  <g clip-path="url(#circle)" opacity="0.85">
    <!-- Head -->
    <ellipse cx="200" cy="160" rx="64" ry="72" fill="rgba(255,255,255,0.12)"/>

    <!-- Hair -->
    <path d="M136 148 Q136 88 200 88 Q264 88 264 148" fill="rgba(255,255,255,0.08)"/>

    <!-- Shoulders -->
    <path d="M140 220 Q160 240 200 240 Q240 240 260 220 L260 360 L140 360 Z" fill="rgba(255,255,255,0.06)"/>

    <!-- Glasses frame -->
    <rect x="165" y="148" width="30" height="20" rx="4" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <rect x="205" y="148" width="30" height="20" rx="4" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="195" y1="158" x2="205" y2="158" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  </g>

  <!-- Accent dot -->
  <circle cx="300" cy="300" r="4" fill="url(#accent)" opacity="0.5"/>
  <circle cx="100" cy="80" r="2" fill="url(#accent)" opacity="0.3"/>
</svg>
