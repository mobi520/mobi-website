<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — 页面未找到</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
      background: #f0f0f0;
      color: #181818;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: 5rem; font-weight: 800; letter-spacing: -0.04em; margin: 0; color: #786060; }
    p { font-size: 1rem; color: #606060; margin: 0.5rem 0 2rem; }
    a {
      display: inline-block;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      background: #181818;
      color: #f0f0f0;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>这个页面不存在</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
