<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBF6F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F2E4DD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C49A8C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4B896;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="line1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C49A8C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C49A8C" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="area1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C49A8C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C49A8C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g stroke="#EDE0D4" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>

  <!-- Main chart area -->
  <rect x="60" y="130" width="250" height="230" rx="8" fill="white" opacity="0.6" stroke="#EDE0D4" stroke-width="0.5"/>

  <!-- Candlestick chart illustration -->
  <g transform="translate(85, 200)">
    <!-- Positive candles (up) -->
    <rect x="0" y="40" width="8" height="70" rx="1" fill="#C49A8C" opacity="0.7"/>
    <rect x="-2" y="35" width="12" height="6" rx="1" fill="#C49A8C" opacity="0.7"/>
    <rect x="18" y="60" width="8" height="50" rx="1" fill="#C49A8C" opacity="0.5"/>
    <rect x="36" y="20" width="8" height="90" rx="1" fill="#C49A8C" opacity="0.8"/>
    <rect x="34" y="15" width="12" height="6" rx="1" fill="#C49A8C" opacity="0.8"/>
    <rect x="54" y="50" width="8" height="60" rx="1" fill="#C49A8C" opacity="0.4"/>
    <rect x="72" y="30" width="8" height="80" rx="1" fill="#C49A8C" opacity="0.7"/>
    <rect x="90" y="55" width="8" height="55" rx="1" fill="#C49A8C" opacity="0.5"/>
    <rect x="108" y="10" width="8" height="100" rx="1" fill="#C49A8C" opacity="0.9"/>
    <rect x="106" y="5" width="12" height="6" rx="1" fill="#C49A8C" opacity="0.9"/>
    <rect x="126" y="65" width="8" height="45" rx="1" fill="#C49A8C" opacity="0.3"/>
    <rect x="144" y="35" width="8" height="75" rx="1" fill="#C49A8C" opacity="0.6"/>
  </g>

  <!-- Bottom axis line -->
  <line x1="75" y1="315" x2="295" y2="315" stroke="#C49A8C" stroke-width="0.5" opacity="0.3"/>

  <!-- Right side - Knowledge graph/metadata -->
  <rect x="350" y="130" width="180" height="230" rx="8" fill="white" opacity="0.6" stroke="#EDE0D4" stroke-width="0.5"/>

  <!-- Node + connections SVG -->
  <circle cx="420" cy="200" r="18" fill="url(#gold)" opacity="0.7"/>
  <circle cx="470" cy="260" r="12" fill="#D4B896" opacity="0.5"/>
  <circle cx="380" cy="260" r="12" fill="#D4B896" opacity="0.5"/>
  <circle cx="400" cy="310" r="8" fill="#EDE0D4" opacity="0.6"/>
  <circle cx="450" cy="310" r="8" fill="#EDE0D4" opacity="0.6"/>
  <circle cx="370" cy="180" r="8" fill="#EDE0D4" opacity="0.5"/>

  <!-- Connection lines between nodes -->
  <g stroke="#C49A8C" stroke-width="0.5" opacity="0.3" fill="none">
    <path d="M420,218 L470,248"/>
    <path d="M420,218 L380,248"/>
    <path d="M420,218 L370,188"/>
    <path d="M470,272 L450,302"/>
    <path d="M380,272 L400,302"/>
    <path d="M470,272 L400,302"/>
  </g>

  <!-- Metrics panel right side -->
  <rect x="560" y="130" width="180" height="230" rx="8" fill="white" opacity="0.6" stroke="#EDE0D4" stroke-width="0.5"/>

  <g transform="translate(580, 155)">
    <rect x="0" y="0" width="140" height="16" rx="3" fill="#EDE0D4" opacity="0.5"/>
    <rect x="0" y="25" width="100" height="16" rx="3" fill="#EDE0D4" opacity="0.3"/>
    <rect x="0" y="50" width="140" height="16" rx="3" fill="#EDE0D4" opacity="0.5"/>
    <rect x="0" y="75" width="60" height="16" rx="3" fill="#EDE0D4" opacity="0.3"/>
    <rect x="0" y="100" width="120" height="16" rx="3" fill="#EDE0D4" opacity="0.4"/>
    <rect x="0" y="125" width="80" height="16" rx="3" fill="#EDE0D4" opacity="0.3"/>
    <rect x="0" y="150" width="140" height="16" rx="3" fill="#C49A8C" opacity="0.15"/>
    <rect x="0" y="175" width="50" height="16" rx="3" fill="#EDE0D4" opacity="0.3"/>
  </g>

  <!-- Bottom bar - mini chart -->
  <rect x="60" y="390" width="680" height="80" rx="8" fill="white" opacity="0.4" stroke="#EDE0D4" stroke-width="0.5"/>

  <!-- Mini line chart -->
  <polyline points="85,440 120,435 155,445 190,430 225,438 260,420 295,428 330,410 365,418 400,400 435,408 470,390 505,398 540,385 575,392 610,378 645,385 680,372 715,380"
    fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
  <polygon points="85,440 120,435 155,445 190,430 225,438 260,420 295,428 330,410 365,418 400,400 435,408 470,390 505,398 540,385 575,392 610,378 645,385 680,372 715,380 715,470 85,470"
    fill="url(#area1)" opacity="0.5"/>

  <!-- Title -->
  <text x="60" y="75" font-family="Georgia,serif" font-size="28" fill="#3A2F2B" letter-spacing="2" font-weight="bold">AI 量化引擎</text>
  <text x="60" y="105" font-family="sans-serif" font-size="11" fill="#8B7D78" letter-spacing="1">主题轮动 · LLM因子 · 知识图谱 · 事件驱动回测</text>

  <!-- Decorative circle -->
  <circle cx="730" cy="60" r="40" fill="url(#gold)" opacity="0.08"/>
  <circle cx="740" cy="50" r="25" fill="url(#gold)" opacity="0.12"/>

</svg>
